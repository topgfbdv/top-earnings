<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #00d632;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 25px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.logo {
    width: 75px;
    height: 75px;
    background: #00d632;
    border-radius: 20px;
    color: black;
    font-size: 48px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
}

h1 {
    font-size: 32px;
    color: #111;
    margin-bottom: 12px;
}

p {
    color: #666;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 35px;
    background: #00d632;
    color: black;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00bd2c;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #888;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">$</div>

    <h1>Welcome to Cash App</h1>

    <p>
        Discover a simple way to send and receive money.
        Get started with Cash App today.
    </p>

    <button onclick="window.location.href='https://cash.app/'">
        Get Started →
    </button>

    <div class="footer">
        Cash App is a financial services platform.
        Eligibility and terms apply.
    </div>

</div>

</body>
</html>
